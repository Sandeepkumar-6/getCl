# Review costs before applying: API compute + 4 GB scanner compute + 4 GB disk.
services:
  - type: web
    name: getclaim-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_TRANSPORT
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLAMAV_HOST
        fromService:
          type: pserv
          name: getclaim-scanner
          property: host
      - key: CLAMAV_PORT
        value: "3310"
  - type: pserv
    name: getclaim-scanner
    runtime: image
    region: singapore
    plan: 2c-4g
    image:
      url: docker.io/clamav/clamav:stable_base
    envVars:
      - key: CLAMAV_NO_MILTER
        value: "true"
    disk:
      name: signatures
      mountPath: /var/lib/clamav
      sizeGB: 4
